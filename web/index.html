<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Container Watch · 容器监控</title>
<style>
:root{font-family:Inter,"Microsoft Yahei",system-ui,sans-serif;color:#172033;background:#f4f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1440px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand h1{margin:0;font-size:24px}.brand p{margin:6px 0 0;color:#667085}.actions{display:flex;gap:10px;align-items:center}button{border:0;border-radius:10px;padding:10px 15px;background:#175cd3;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e8eef8;color:#344054}button:disabled{opacity:.5;cursor:wait}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel,.container{background:white;border:1px solid #e4eaf2;border-radius:14px;box-shadow:0 2px 7px #1018280a}.stat{padding:18px 20px}.stat small{color:#667085}.stat strong{display:block;margin-top:6px;font-size:26px}.panel{padding:18px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.toolbar h2{font-size:18px;margin:0}.toolbar input,.toolbar select{border:1px solid #d0d5dd;border-radius:9px;padding:9px 11px;background:transparent;color:inherit}.filters{display:flex;gap:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.container{padding:16px 18px;min-width:0}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.name{font-weight:700;font-size:16px;overflow-wrap:anywhere}.badge{font-size:12px;border-radius:999px;padding:4px 9px;background:#ecfdf3;color:#067647;white-space:nowrap}.badge.stopped{background:#f2f4f7;color:#475467}.badge.warn{background:#fff4e5;color:#b54708}.image{margin:9px 0;color:#475467;font:13px ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:7px 14px;color:#667085;font-size:12px}.tag{background:#f2f4f7;border-radius:6px;padding:3px 7px}.update{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid #eaecf0;font-size:13px}.update button{padding:7px 10px;font-size:12px}.foot{display:flex;justify-content:space-between;color:#667085;font-size:12px;margin-top:14px}.error{padding:12px;color:#b42318;background:#fef3f2;border-radius:10px;margin:12px 0}.empty{padding:40px;text-align:center;color:#667085}.hidden{display:none!important}dialog{border:0;border-radius:16px;padding:22px;max-width:500px;width:calc(100% - 30px);box-shadow:0 20px 80px #10182844}dialog::backdrop{background:#10182888}dialog h3{margin-top:0}dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.danger{background:#b42318}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:16px}.top{align-items:flex-start}.top .actions{flex-direction:column;align-items:stretch}.cards{gap:8px}.stat{padding:13px}.stat strong{font-size:22px}.toolbar{align-items:flex-start;flex-direction:column}.filters{width:100%;flex-wrap:wrap}.filters input{flex:1;min-width:130px}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand"><h1>🐳 Container Watch</h1><p>Docker 容器状态与镜像更新检查</p></div><div class="actions"><button class="secondary" id="refresh">刷新列表</button><button id="check">检查镜像更新</button></div></header>
<div id="error" class="error hidden"></div><section class="cards"><div class="stat"><small>容器总数</small><strong id="total">—</strong></div><div class="stat"><small>运行中</small><strong id="running">—</strong></div><div class="stat"><small>已停止</small><strong id="stopped">—</strong></div><div class="stat"><small>发现可更新</small><strong id="updates">—</strong></div></section>
<section class="panel"><div class="toolbar"><h2>容器清单</h2><div class="filters"><input id="search" placeholder="搜索名称、镜像、Compose 项目"><select id="state"><option value="">全部状态</option><option value="running">运行中</option><option value="exited">已停止</option></select></div></div><div id="grid" class="grid"></div><div class="foot"><span id="stamp">等待加载</span><span>列表每 10 秒自动刷新</span></div></section></main>
<dialog id="confirm"><h3>更新 Compose 服务？</h3><p id="confirmText"></p><p>将拉取配置中声明的镜像，并仅重建此 Compose 服务（不依赖启动其他服务）。容器可能短暂中断；若镜像标签未固定，更新可能采用上游最新镜像。请确保重要数据位于持久化卷或绑定目录。</p><div class="btns"><button class="secondary" id="cancel">取消</button><button id="doUpdate">确认更新</button></div></dialog>
<script>
const $=s=>document.querySelector(s);let rows=[],checking=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Requested-With':'ContainerWatch',...(options.headers||{})}});if(r.status===401){$('#error').textContent='登录认证失败，请刷新后重新输入账号密码。';throw Error('认证失败')}const data=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw Error(data.error||r.statusText);return data}
function showError(e){$('#error').textContent=e.message||String(e);$('#error').classList.remove('hidden')}function clearError(){$('#error').classList.add('hidden')}
async function load(){try{const [summary,list]=await Promise.all([api('/api/summary'),api('/api/containers')]);rows=list;$('#total').textContent=summary.containers;$('#running').textContent=summary.running;$('#stopped').textContent=summary.stopped;$('#stamp').textContent='最后刷新：'+new Date().toLocaleString();render()}catch(e){showError(e)}}
function render(){const q=$('#search').value.toLowerCase(),state=$('#state').value;const items=rows.filter(x=>(!state||x.state===state)&&(!q||[x.name,x.image,x.project,x.service].join(' ').toLowerCase().includes(q)));$('#grid').innerHTML=items.length?items.map(x=>`<article class="container"><div class="row"><div class="name">${esc(x.name||x.id.slice(0,12))}</div><span class="badge ${x.state==='running'?'':'stopped'}">${x.state==='running'?'运行中':esc(x.state)}</span></div><div class="image">${esc(x.image)}</div><div class="meta"><span class="tag">版本 ${esc(x.version||'unknown')}</span>${x.revision?`<span>revision ${esc(x.revision.slice(0,12))}</span>`:''}${x.imageCreated?`<span>镜像构建 ${esc(x.imageCreated.slice(0,10))}</span>`:''}${x.imageDigest?`<span>digest ${esc(x.imageDigest.slice(-12))}</span>`:''}${x.project?`<span>Compose: ${esc(x.project)} / ${esc(x.service)}</span>`:''}<span>${esc(x.status)}</span>${x.ports?.length?`<span>端口：${esc(x.ports.join(', '))}</span>`:''}</div><div class="update"><span class="${x.canUpdate?'':'muted'}">${x.canUpdate?'发现新镜像版本':esc(x.updateReason||'尚未检查更新')}</span>${x.project&&x.service&&x.canUpdate?`<button data-update="${esc(x.id)}">手动更新</button>`:''}</div></article>`).join(''):'<div class="empty">没有匹配的容器</div>';const n=rows.filter(x=>x.canUpdate).length;$('#updates').textContent=n;document.querySelectorAll('[data-update]').forEach(b=>b.addEventListener('click',()=>updateDialog(b.dataset.update)))}
async function check(){if(checking)return;checking=true;$('#check').disabled=true;$('#check').textContent='检查中…';clearError();try{const res=await api('/api/updates/check',{method:'POST'});rows=res.containers;$('#stamp').textContent='更新检查完成：'+new Date(res.checkedAt).toLocaleString();render()}catch(e){showError(e)}finally{checking=false;$('#check').disabled=false;$('#check').textContent='检查镜像更新'}}
let target;function updateDialog(id){target=id;const x=rows.find(y=>y.id===id);$('#confirmText').textContent=`容器 ${x?.name}（${x?.image}）`;$('#confirm').showModal()}$('#cancel').onclick=()=>$('#confirm').close();$('#doUpdate').onclick=async()=>{const b=$('#doUpdate');b.disabled=true;try{await api(`/api/containers/${encodeURIComponent(target)}/update`,{method:'POST'});$('#confirm').close();await load()}catch(e){showError(e)}finally{b.disabled=false}};
$('#refresh').onclick=load;$('#check').onclick=check;$('#search').oninput=render;$('#state').onchange=render;load();setInterval(load,10000);
</script></body></html>
